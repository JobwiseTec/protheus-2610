# Sobreposição opcional: DeskFlow Control gerenciando os containers do Protheus 2610.
#
#   docker compose -f docker-compose.yml -f docker-compose.deskflow.yml up -d
#
# Pré-requisito: as pastas ./volume/protheus12 e ./volume/dbaccess precisam existir
# com o conteúdo das imagens (rode ./seed-volumes.sh uma vez). Com elas montadas
# no MESMO caminho dentro dos containers (/protheus12, /dbaccess/multi) e dentro do
# DeskFlow, INIs, RPO, console.log e dbaccess.ini viram arquivos que o DeskFlow
# edita, promove e audita diretamente.
services:
    protheus:
        volumes:
            - ./volume/protheus12:/protheus12
    protheus-exclusivo:
        volumes:
            - ./volume/protheus12/bin/appserver-exclusivo:/protheus12/bin/appserver
            - ./volume/protheus12/apo:/protheus12/apo
            - ./volume/protheus12/protheus_data:/protheus12/protheus_data
    license:
        volumes:
            - ./volume/protheus12/bin/appserver-license:/protheus12/bin/appserver
    dbaccess:
        volumes:
            - ./volume/dbaccess/multi:/dbaccess/multi

    deskflow:
        image: emebatista/deskflow-2610:latest
        platform: linux/amd64
        container_name: deskflow-2610
        # Vê os processos dos outros containers (appsrvlinux, dbaccess64) para
        # decidir Running/Stopped, e os controla pelo socket do Docker.
        pid: host
        cap_add:
            - SYS_PTRACE
        ports:
            - "8074:8074"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./deskflow:/opt/deskflow
            - ./docker-compose.yml:/opt/protheus/docker-compose.yml:ro
            - ./conf.inf:/opt/protheus/conf.inf:ro
            - ./volume/protheus12:/protheus12
            - ./volume/dbaccess/multi:/dbaccess/multi
        networks:
            - protheus
        restart: unless-stopped

    # UI em http://localhost:8073 (usuário admin, senha msadm — troque no 1º acesso)
    deskflow-web:
        image: nginx:1.27-alpine
        container_name: deskflow-web-2610
        ports:
            - "8073:8073"
        volumes:
            - ./deskflow/nginx/deskflow.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - deskflow
        networks:
            - protheus
        restart: unless-stopped
