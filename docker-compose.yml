# Protheus 12.1.2610 em containers, gerenciado pelo DeskFlow Control.
#   docker compose up -d
# UI do DeskFlow: http://localhost:8073 (admin / msadm), container único. Protheus: porta 1234
# (SmartClient) e http://localhost:4321 (WebApp).
#
# Nome fixo do projeto: os wrappers init.d dentro do container do DeskFlow
# chamam `docker compose -f /opt/protheus/docker-compose.yml` e precisam
# enxergar os MESMOS containers, seja qual for o nome da sua pasta.
name: protheus2610

services:
    db:
        image: ghcr.io/jobwisetec/postgres-2610:latest
        container_name: postgresql-2610
        platform: linux/amd64
        user: root
        ports:
            - "5432:5432"
        volumes:
            # Volume nomeado: na primeira subida o Docker o preenche com o cluster
            # já restaurado que vem na imagem (base 12.1.2610 pronta, sem restore).
            - pgdata:/var/lib/postgresql/seed
        networks:
            - protheus
        restart: always
    license:
        image: ghcr.io/jobwisetec/license-server-2610:latest
        container_name: license-server-2610
        platform: linux/amd64
        ports:
            - "8020:80"
            - "2234:2234"
            - "5555:5555"
        volumes:
            # Visto pelo DeskFlow como /protheus12/bin/appserver-license.
            - protheus12-license:/protheus12/bin/appserver
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always
    dbaccess:
        image: ghcr.io/jobwisetec/protheus-dbaccess-2610:latest
        platform: linux/amd64
        container_name: dbaccess-2610
        ports:
          - "7890:7890"
        env_file:
          - conf.inf
        volumes:
            # dbaccess.ini e dbaccess.log visíveis ao DeskFlow.
            - dbaccess-multi:/dbaccess/multi
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65535
                hard: 65535
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always
        depends_on:
            - db
            - license
    protheus:
        image: ghcr.io/jobwisetec/protheus-2610:latest
        platform: linux/amd64
        container_name: protheus-2610
        ports:
            - "1234:1234"
            - "4321:4321"
            - "8181:8181"
        environment:
            - APPSERVER_DATABASE=POSTGRES
        volumes:
            # Volume nomeado: o Docker o preenche com o conteúdo da imagem na
            # primeira subida; o DeskFlow monta o mesmo volume e vê INIs, RPO,
            # protheus_data e console.log pelos mesmos caminhos.
            - protheus12:/protheus12
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always
        depends_on:
            - dbaccess
    # Acesso exclusivo: mesma imagem do protheus, mesmo volume; APPSERVER_DIR faz
    # o entrypoint subir o AppServer em /protheus12/bin/appserver-exclusivo
    # (INI próprio: portas 1235/4322, sem REST). Só o DeskFlow o levanta (Modo
    # Exclusivo), com o protheus parado.
    protheus-exclusivo:
        image: ghcr.io/jobwisetec/protheus-2610:latest
        platform: linux/amd64
        container_name: protheus-2610-exclusivo
        profiles:
            - exclusivo
        ports:
            - "1235:1235"
            - "4322:4322"
        environment:
            - APPSERVER_DATABASE=POSTGRES
            - APPSERVER_DIR=appserver-exclusivo
        volumes:
            - protheus12:/protheus12
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always
        depends_on:
            - dbaccess
    smartview:
        image: ghcr.io/jobwisetec/smartview-2610:latest
        platform: linux/amd64
        container_name: smartview-2610
        ports:
            - "7017:7017"
            - "7019:7019"
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always

    # ── DeskFlow Control ───────────────────────────────────────────────────
    # Gerencia os containers acima como serviços (start/stop/restart, modo
    # exclusivo, INIs, RPO, patches, dicionário, logs ao vivo, auditoria).
    # Container único: nginx (UI em 8073) + backend na mesma imagem.
    # pid:host + SYS_PTRACE + docker.sock são o mecanismo pelo qual ele enxerga
    # e controla os outros containers — é o desenho do produto, pensado para
    # demonstração e desenvolvimento. Em servidor compartilhado, publique a UI
    # só em 127.0.0.1 ou atrás de um proxy com TLS e troque a senha padrão.
    deskflow:
        image: ghcr.io/jobwisetec/deskflow-2610:latest
        platform: linux/amd64
        container_name: deskflow-2610
        pid: host
        cap_add:
            - SYS_PTRACE
        ports:
            - "8073:8073"
        volumes:
            - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
            # deskflow.ini, config.json (topologia), data/, logs/, licença —
            # ficam na sua pasta e sobrevivem a recriações do container.
            - ./deskflow:/opt/deskflow
            - ./docker-compose.yml:/opt/protheus/docker-compose.yml:ro
            - ./conf.inf:/opt/protheus/conf.inf:ro
            - protheus12:/protheus12
            - protheus12-license:/protheus12/bin/appserver-license
            - dbaccess-multi:/dbaccess/multi
        networks:
            - protheus
        restart: always
        depends_on:
            - protheus

volumes:
    pgdata:
    protheus12:
    protheus12-license:
    dbaccess-multi:

networks:
    protheus:
