# Protheus 12.1.2610 em containers, gerenciado pelo DeskFlow Control.
#   docker compose up -d
# UI do DeskFlow: http://localhost:8073 (admin / msadm). Protheus: porta 1234
# (SmartClient) e http://localhost:4321 (WebApp).
#
# Nome fixo do projeto: os wrappers init.d dentro do container do DeskFlow
# chamam `docker compose -f /opt/protheus/docker-compose.yml` e precisam
# enxergar os MESMOS containers, seja qual for o nome da sua pasta.
name: protheus2610

services:
    db:
        image: emebatista/postgres-2610:latest
        container_name: postgresql-2610
        platform: linux/amd64
        user: root
        ports:
            - "5432:5432"
        volumes:
            - ./volume/data/psql:/var/lib/postgresql/data
        networks:
            - protheus
        restart: always
    license:
        image: emebatista/license-server-2610:latest
        container_name: license-server-2610
        platform: linux/amd64
        ports:
            - "8020:80"
            - "2234:2234"
            - "5555:5555"
        volumes:
            # Visto pelo DeskFlow como /protheus12/bin/appserver-license.
            - protheus12-license:/protheus12/bin/appserver
        devices:
            - "/dev/mem:/dev/mem"
        cap_add:
            - sys_rawio
        privileged: true
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always
    dbaccess:
        image: emebatista/protheus-dbaccess-2610:latest
        platform: linux/amd64
        container_name: dbaccess-2610
        ports:
          - "7890:7890"
        env_file:
          - conf.inf
        volumes:
            # dbaccess.ini e dbaccess.log visíveis ao DeskFlow.
            - dbaccess-multi:/dbaccess/multi
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65535
                hard: 65535
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always
        depends_on:
            - db
            - license
    protheus:
        image: emebatista/protheus-2610:latest
        platform: linux/amd64
        container_name: protheus-2610
        ports:
            - "1234:1234"
            - "4321:4321"
            - "8181:8181"
        environment:
            - APPSERVER_DATABASE=POSTGRES
        volumes:
            # Volume nomeado: o Docker o preenche com o conteúdo da imagem na
            # primeira subida; o DeskFlow monta o mesmo volume e vê INIs, RPO,
            # protheus_data e console.log pelos mesmos caminhos.
            - protheus12:/protheus12
            - ./volume/data/system_temp:/protheus12/protheus_data/system_temp
        devices:
            - "/dev/mem:/dev/mem"
        cap_add:
            - sys_rawio
        privileged: true
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always
        depends_on:
            - dbaccess
    protheus-exclusivo:
        image: emebatista/protheus-2610:latest
        platform: linux/amd64
        container_name: protheus-2610-exclusivo
        profiles:
            - exclusivo
        ports:
            - "1235:1235"
            - "4322:4322"
        environment:
            - APPSERVER_DATABASE=POSTGRES
        volumes:
            # Mesmo RPO/protheus_data do protheus; pasta bin própria (INI do
            # modo exclusivo), vista pelo DeskFlow como bin/appserver-exclusivo.
            - protheus12:/protheus12
            - protheus12-exclusivo:/protheus12/bin/appserver
            - ./volume/data/system_temp:/protheus12/protheus_data/system_temp
        devices:
            - "/dev/mem:/dev/mem"
        cap_add:
            - sys_rawio
        privileged: true
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always
        depends_on:
            - dbaccess
    smartview:
        image: emebatista/smartview-2610:latest
        platform: linux/amd64
        container_name: smartview-2610
        ports:
            - "7017:7017"
            - "7019:7019"
        ulimits:
            core:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
            stack:
                soft: 1048576
                hard: 1048576
        networks:
            - protheus
        restart: always

    # ── DeskFlow Control ───────────────────────────────────────────────────
    # Gerencia os containers acima como serviços (start/stop/restart, modo
    # exclusivo, INIs, RPO, patches, dicionário, logs ao vivo, auditoria).
    # pid:host + SYS_PTRACE + docker.sock são o mecanismo pelo qual ele enxerga
    # e controla os outros containers — é o desenho do produto, pensado para
    # demonstração e desenvolvimento. Em servidor compartilhado, publique a UI
    # só em 127.0.0.1 ou atrás de um proxy com TLS e troque a senha padrão.
    deskflow:
        image: emebatista/deskflow-2610:latest
        platform: linux/amd64
        container_name: deskflow-2610
        pid: host
        cap_add:
            - SYS_PTRACE
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            # deskflow.ini, config.json (topologia), data/, logs/, licença —
            # ficam na sua pasta e sobrevivem a recriações do container.
            - ./deskflow:/opt/deskflow
            - ./docker-compose.yml:/opt/protheus/docker-compose.yml:ro
            - ./conf.inf:/opt/protheus/conf.inf:ro
            - protheus12:/protheus12
            - protheus12-exclusivo:/protheus12/bin/appserver-exclusivo
            - protheus12-license:/protheus12/bin/appserver-license
            - dbaccess-multi:/dbaccess/multi
        networks:
            - protheus
        restart: always
        depends_on:
            - protheus

    # UI em http://localhost:8073 — o nginx remove o prefixo /api/ que a UI usa.
    deskflow-web:
        image: nginx:1.27-alpine
        container_name: deskflow-web-2610
        ports:
            - "8073:8073"
        volumes:
            - ./deskflow/nginx/deskflow.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - deskflow
        networks:
            - protheus
        restart: always

volumes:
    protheus12:
    protheus12-exclusivo:
    protheus12-license:
    dbaccess-multi:

networks:
    protheus:
