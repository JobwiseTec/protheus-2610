# nginx na frente do DeskFlow em container: a UI chama /api/<rota> e o binário
# só conhece /<rota>, então o prefixo é removido aqui (mesmo papel do nginx
# empacotado no RPM). Estáticos e SPA são servidos pelo próprio binário.
server {
    listen 8073;
    server_name _;
    client_max_body_size 4g;

    location /api/ {
        proxy_pass http://deskflow:8074/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://deskflow:8074/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://deskflow:8074;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
